
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Data Attributes</title>
</head>

<body class="p-8 space-y-4">
    <div class="flex flex-wrap gap-2">
        <button class="choix px-3 py-1 rounded bg-red-500 text-white"
            data-couleur="bg-red-500" data-nom="Rouge">
            Rouge
        </button>
        <button class="choix px-3 py-1 rounded bg-green-500 text-white"
            data-couleur="bg-green-500" data-nom="Vert">
            Vert
        </button>
        <button class="choix px-3 py-1 rounded bg-blue-500 text-white"
            data-couleur="bg-blue-500" data-nom="Bleu" data-prix-unitaire="5">
            Bleu
        </button>
        <button class="choix px-3 py-1 rounded bg-yellow-400 text-black"
            data-couleur="bg-yellow-400" data-nom="Jaune">
            Jaune
        </button>
    </div>
    <div id="apercu" class="h-32 rounded border"></div>
    <p id="info"></p>
    <script src="main.js"></script>
</body>
</html>
